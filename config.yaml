ocr:
  languages: ["en"]
  gpu: false
  general_passes: 3
  dimension_allowlist: "0123456789xX.:/-'\"mMftincFTINC "
  rotation_info: [ 90, 180, 270]
  debug_raw_detections: false
  min_size: 3
  text_threshold: 0.45
  low_text: 0.25
  link_threshold: 0.20
  # image size restriction
  canvas_size: 3840
  mag_ratio: 1.5
  contrast_ths: 0.20
  adjust_contrast: 0.70

preprocessing:
  upscale_factor: 2.0
  gaussian_kernel: 3

confidence:
  room_label_min_confidence: 0.75
  ocr_review_threshold: 0.50
  association_review_threshold: 0.60
  ocr_weight: 0.6
  association_weight: 0.4

room_labels:
  alias_min_confidence: 0.60
  duplicate_overlap_threshold: 0.5
  known_room_min_confidence: 0.55
  known_room_words:
    - kitchen
    - breakfast
    - pantry
    - foyer
    - garage
    - porch
    - bath
    - bedroom
    - living
    - dining
    - library
    - study
    - family
    - laundry
    - store
    - closet
    - w.i.c.
  ocr_aliases:
    "IPANTRY": "PANTRY"
    "WJ.C:": "W.I.C."
  non_room_vocabulary:
    - above
    - open to
    - door
    - opt
    - dn
    - up

association:
  max_normalized_distance: 0.35

validation:
  numeric_tolerance_mm: 5.0

warnings:
  suppress_overlap_threshold: 0.5
