ocr:
  languages: ["en"]
  gpu: false
  dimension_allowlist: "0123456789xX.:/-'\"mMftincFTINC "
  rotation_info: [90, 180, 270]
  debug_raw_detections: false
  min_size: 5
  text_threshold: 0.55
  low_text: 0.30
  link_threshold: 0.30
  canvas_size: 1600
  mag_ratio: 1.0
  contrast_ths: 0.20
  adjust_contrast: 0.70

preprocessing:
  upscale_factor: 1.0
  gaussian_kernel: 3

confidence:
  review_threshold: 0.75
  ocr_weight: 0.6
  association_weight: 0.4

association:
  max_normalized_distance: 0.35

validation:
  numeric_tolerance_mm: 5.0